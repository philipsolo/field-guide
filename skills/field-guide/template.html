<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="icon" type="image/svg+xml" href="{{FAVICON}}">
<meta name="doc-kind" content="{{KIND}}">
<meta name="description" content="{{DESC}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f4ef">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap');
/* ============================================================
   Field Guide — tokens. Everything below reads these roles.
   Chart slots = validated dataviz palette (CVD-checked order).
   ============================================================ */
:root{color-scheme:light;
  --page:#f6f4ef;--surface:#fffefb;--surface-2:#f1eee7;--surface-3:#e9e5dc;
  --ink:#1a1916;--ink-2:#55514a;--muted:#8a857c;--line:#e5e1d8;--line-2:#cfc9bd;
  --accent:#2a78d6;--accent-ink:#1c5cab;--accent-wash:#e7f0fb;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --good:#0ca30c;--good-ink:#006300;--good-wash:#e8f5e6;
  --warn:#fab219;--warn-ink:#7a5200;--warn-wash:#fdf3dc;
  --bad:#d03b3b;--bad-ink:#a42828;--bad-wash:#fbe9e7;
  --grid:#e1e0d9;--axis:#c3c2b7;
  --r:16px;--r-s:10px;--r-xs:6px;
  --shadow:0 1px 2px rgba(26,25,22,.05),0 10px 30px -18px rgba(26,25,22,.25);
  --shadow-lift:0 2px 4px rgba(26,25,22,.06),0 18px 40px -20px rgba(26,25,22,.35);
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1)}
html[data-theme="dark"]{color-scheme:dark;
  --page:#0e0e0d;--surface:#181816;--surface-2:#20201d;--surface-3:#2a2a26;
  --ink:#f2f0ea;--ink-2:#c3c2b7;--muted:#8f8a80;--line:#2c2c2a;--line-2:#3d3c38;
  --accent:#3987e5;--accent-ink:#86b6ef;--accent-wash:#12243b;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --good:#0ca30c;--good-ink:#3dd68c;--good-wash:#0f2615;
  --warn:#fab219;--warn-ink:#e9c15a;--warn-wash:#2a2110;
  --bad:#d03b3b;--bad-ink:#ff8a88;--bad-wash:#2d1414;
  --grid:#2c2c2a;--axis:#383835;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5),0 18px 40px -20px rgba(0,0,0,.9)}

/* ---------- base ---------- */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
[id]{scroll-margin-top:72px}
body{background:var(--page);color:var(--ink);font:15.5px/1.62 var(--sans);-webkit-font-smoothing:antialiased;touch-action:manipulation;text-rendering:optimizeLegibility}
/* layout: one gutter var drives wrap/hero/toc bleed; wide screens get a wider column, the rail gets its own lane */
:root{--gut:clamp(16px,3.2vw,48px);--maxw:1480px;--measure:80ch;--padr:var(--gut);
  --wl:max(0px,calc((100vw - var(--maxw))/2 - var(--gut)))} /* --wl = empty space left of the centred wrap */
@media (min-width:1181px){:root{--padr:max(var(--gut),76px)}} /* right lane for the section rail */
html,body{overflow-x:clip}
.wrap{max-width:calc(var(--maxw) + 2*var(--gut));margin:0 auto;padding:0 var(--padr) 80px var(--gut)}
/* full-bleed bands (hero, sticky nav): edge to edge, with content aligned to the column */
.hero,.toc{width:100vw;margin-left:calc(-1*(var(--wl) + var(--gut)));margin-right:0}
a{color:var(--accent-ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:3px}
a:hover{text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
p{margin:10px 0;max-width:var(--measure)}
ul,ol{padding-left:22px;margin:10px 0}li{margin:5px 0;max-width:var(--measure)}
strong,b{font-weight:600}
code{font:.88em var(--mono);background:var(--surface-2);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
h1,h2{font-family:var(--display);font-weight:600;letter-spacing:-.02em;text-wrap:balance;font-optical-sizing:auto}
h1{font-size:clamp(34px,5.2vw,58px);line-height:1.1}
h2{font-size:clamp(24px,3vw,32px);line-height:1.18}
h3{font:600 17px/1.3 var(--sans);letter-spacing:-.01em;margin:22px 0 8px;text-wrap:balance}
.kicker{font:500 11.5px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:18px;line-height:1.55;color:var(--ink-2);max-width:72ch}
.muted{color:var(--muted)}.small{font-size:13px}
.num,.tnum{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:200;background:var(--surface);padding:8px 12px;border-radius:8px}

/* ---------- toolbar (edit / theme / pdf) ---------- */
.toolbar{position:fixed;top:12px;right:12px;display:flex;gap:6px;z-index:60}
.toolbar button{font:500 12px var(--mono);padding:6px 11px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(10px);color:var(--ink);border-radius:999px;cursor:pointer;box-shadow:var(--shadow)}
.toolbar button:hover{border-color:var(--line-2)}

/* ---------- hero ---------- */
.hero{position:relative;margin-bottom:8px;padding:84px calc(var(--wl) + var(--padr)) 40px calc(var(--wl) + var(--gut));border-bottom:1px solid var(--line);overflow:hidden;contain:paint}
.hero .inner{position:relative;z-index:1}
.hero h1{margin:12px 0 14px;max-width:22ch}
.hero .lede{margin-bottom:22px}
.hero.has-img{color:#fff;min-height:420px;display:flex;align-items:flex-end;border-bottom:none}
.hero.has-img .kicker,.hero.has-img .lede{color:rgba(255,255,255,.85)}
.hero.has-img .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero.has-img .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.72))}
.hero .facts{display:flex;flex-wrap:wrap;gap:8px}
.hero .facts span{font:500 12.5px var(--mono);padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.hero.has-img .facts span{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(6px)}
.hero .glow{position:absolute;inset:-40% -10% auto auto;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 65%);pointer-events:none}

/* ---------- sticky section nav ---------- */
.toc{position:sticky;top:0;z-index:40;padding:10px calc(var(--wl) + var(--padr)) 10px calc(var(--wl) + var(--gut));background:color-mix(in srgb,var(--page) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.toc-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.toc-in::-webkit-scrollbar{display:none}
.toc a{flex:none;font:500 12.5px var(--sans);padding:6px 12px;border-radius:999px;color:var(--ink-2);text-decoration:none;border:1px solid transparent}
.toc a:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.toc a b{font:500 11px var(--mono);color:var(--muted);margin-right:6px}

/* ---------- sections ---------- */
.sec{margin:64px 0 0;scroll-margin-top:72px}
.sec-head{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:baseline;margin-bottom:20px}
.sec-head h2{line-height:1.18}
.sec-head .n{font:600 13px var(--mono);color:var(--accent);grid-row:1/3;padding-top:10px}
.sec-head .lede{grid-column:2;font-size:16px;margin:4px 0 0}

/* ---------- reveal & motion (CSS-only: survives innerHTML restore) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow-x{from{transform:scaleX(0)}}
@keyframes grow-y{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes ring{from{stroke-dasharray:0 100}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:no-preference){
  .rv{animation:rise .8s var(--ease) both}
  .bars .fill,.meter .fill{animation:grow-x 1.1s var(--ease) both;transform-origin:left}
  .col-bar{animation:grow-y 1s var(--ease) both;transform-box:fill-box;transform-origin:bottom}
  .line-path{stroke-dasharray:1;animation:draw 1.6s var(--ease) both}
  .ring-arc,.donut-arc{animation:ring 1.3s var(--ease) both}
  .pt{animation:fade .6s .9s both}
  @supports (animation-timeline:view()){
    .rv,.bars .fill,.meter .fill,.col-bar,.line-path,.ring-arc,.donut-arc{animation-timeline:view();animation-range:entry 5% cover 30%}
  }
}

/* ---------- cards & surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(var(--min,260px),1fr))}
.grid.fixed{grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
@media (max-width:1000px){.grid.fixed{grid-template-columns:repeat(min(var(--cols,3),2),minmax(0,1fr))}}
@media (max-width:600px){.grid.fixed{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
.stack>*+*{margin-top:12px}

/* stat tiles */
.stats{display:grid;gap:12px;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));margin:18px 0}
@media (max-width:1000px){.stats{grid-template-columns:repeat(min(var(--n,4),2),minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .l{font-size:13px;color:var(--ink-2)}
.stat .v{font:600 34px/1.1 var(--sans);letter-spacing:-.03em;margin:6px 0 2px}
.stat .v small{font-size:15px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.stat .d{font:500 12.5px var(--sans);color:var(--muted)}
.stat .d.up{color:var(--good-ink)}.stat .d.down{color:var(--bad-ink)}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}

/* image cards — big imagery, clear outlines */
.icard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);color:inherit;text-decoration:none;transition:box-shadow .25s,transform .25s,border-color .25s}
a.icard:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);border-color:var(--line-2)}
.icard .img{aspect-ratio:var(--ar,16/10);overflow:hidden;min-height:0;background:var(--surface-2) center/contain no-repeat;border-bottom:1px solid var(--line)}
.icard .img.cover{background-size:cover}
.icard .img img{width:100%;height:100%;object-fit:var(--fit,contain);display:block;padding:var(--pad,10px)}
.icard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.icard .t{font:600 15.5px/1.3 var(--sans)}
.icard .m{font-size:13px;color:var(--ink-2)}
.icard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:6px}
.icard .price{font:600 18px var(--sans);letter-spacing:-.02em}
.icard .price small{font-size:12px;font-weight:500;color:var(--muted)}

/* media row — list item with a real-size thumbnail */
.mrow{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);color:inherit;text-decoration:none}
.mrow+.mrow{margin-top:10px}
.mrow .th{width:96px;height:96px;border-radius:12px;background:#fff;border:1px solid var(--line);object-fit:contain;padding:6px}
.mrow .t{font-weight:600;font-size:15px}
.mrow .m{font-size:13px;color:var(--ink-2);margin-top:2px}
.mrow .aside{text-align:right;font:600 16px var(--sans)}
.mrow .aside small{display:block;font-weight:400;font-size:12px;color:var(--muted)}

/* tags / badges */
.tag{display:inline-flex;align-items:center;gap:4px;font:500 11.5px/1 var(--sans);padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);vertical-align:2px;white-space:nowrap}
.tag.accent{background:var(--accent-wash);color:var(--accent-ink);border-color:transparent}
.tag.good{background:var(--good-wash);color:var(--good-ink);border-color:transparent}
.tag.warn{background:var(--warn-wash);color:var(--warn-ink);border-color:transparent}
.tag.bad{background:var(--bad-wash);color:var(--bad-ink);border-color:transparent}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));margin-right:6px;vertical-align:0}

/* callouts */
.callout{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 18px;border-radius:var(--r-s);background:var(--accent-wash)}
.callout .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--sans);background:var(--surface);color:var(--accent-ink)}
.callout.good{background:var(--good-wash)}.callout.good .ic{color:var(--good-ink)}
.callout.warn{background:var(--warn-wash)}.callout.warn .ic{color:var(--warn-ink)}
.callout.bad{background:var(--bad-wash)}.callout.bad .ic{color:var(--bad-ink)}
.callout .ct{font-weight:600;margin-bottom:2px}
.callout p{margin:4px 0}

/* tables */
.tablewrap{border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;background:var(--surface);box-shadow:var(--shadow);margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:500 11.5px/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);vertical-align:bottom}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5;overflow-wrap:break-word}
td>:first-child{margin-top:0}td>:last-child{margin-bottom:0}td p,td li{max-width:none}
th.num,td.num{text-align:right;white-space:nowrap}
table td:first-child,table th:first-child{padding-left:16px}table td:last-child,table th:last-child{padding-right:16px}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.best{background:var(--good-wash);color:var(--good-ink);font-weight:600}

/* ---------- charts ---------- */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 14px;box-shadow:var(--shadow)}
.chart .ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.chart .ch h4{font:600 15px var(--sans)}
.chart .ch .sub{font-size:12.5px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font:11.5px var(--sans);fill:var(--muted)}
.chart svg .lbl{fill:var(--ink-2);font-weight:500}
.chart svg .val{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chart svg .gl{stroke:var(--grid);stroke-width:1}
.chart svg .ax{stroke:var(--axis);stroke-width:1}
.chart svg .hit:hover+.col-bar,.chart svg g.col:hover .col-bar{filter:brightness(1.1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}

/* horizontal bars (HTML) */
.bars{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:10px 12px;align-items:center}
.bars .bl{font-size:13.5px;color:var(--ink-2)}
.bars .tr{height:14px;border-radius:4px;background:var(--surface-2);position:relative;overflow:hidden}
.bars .fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--c,var(--accent))}
.bars .bv{font:600 13.5px var(--sans);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bars .bv small{font-weight:400;color:var(--muted);margin-left:4px}
.bars .row{display:contents}
.bars .row:hover .bl{color:var(--ink)}

/* meter */
.meter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 16px;box-shadow:var(--shadow)}.meter .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.meter .tr{height:10px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--c,var(--accent))}
.meter .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}

/* rings */
.rings{display:flex;flex-wrap:wrap;gap:22px;justify-content:space-around}
.ringbox{text-align:center;width:130px}
.ringbox svg{width:120px;height:120px}
.ringbox .rv-v{font:600 22px var(--sans);letter-spacing:-.02em;fill:var(--ink)}
.ringbox .rv-u{font:11px var(--sans);fill:var(--muted)}
.ringbox .rl{font-size:13px;color:var(--ink-2);margin-top:4px}

/* timeline */
.timeline{position:relative;padding:18px 20px 2px 50px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.timeline::before{content:"";position:absolute;left:30px;top:24px;bottom:24px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 18px}
.tl::before{content:"";position:absolute;left:-26px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--c,var(--accent))}
.tl.go{display:block;color:inherit;text-decoration:none;border-radius:10px;margin:0 -10px;padding:6px 10px 14px}.tl.go::before{left:-16px;top:11px}
.tl.go:hover{background:var(--surface-2)}.tl.go .what::after{content:" →";color:var(--accent-ink)}
.tl .when{font:500 12px var(--mono);color:var(--muted)}
.tl .what{font-weight:600}
.tl p{margin:3px 0;font-size:14px;color:var(--ink-2)}

/* steps */
.steps{counter-reset:s;list-style:none;padding:18px 20px 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.steps li{counter-increment:s;position:relative;padding:2px 0 12px 44px;max-width:72ch}
.steps.check li{padding:0;margin:0 -10px}
.steps.check label{display:block;padding:6px 10px 10px 54px;border-radius:10px;cursor:pointer;position:relative}
.steps.check label:hover{background:var(--surface-2)}
.steps.check input{position:absolute;opacity:0;pointer-events:none}
.steps.check li::before{left:10px;top:4px;z-index:1;pointer-events:none}
.steps.check li:has(input:checked)::before{content:"✓";background:var(--good-wash);color:var(--good-ink)}
.steps.check li:has(input:checked) label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.steps.check label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent-wash);color:var(--accent-ink);font:600 13px var(--sans);display:grid;place-items:center}

/* compare columns */
.compare{display:grid;gap:14px;margin:16px 0;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.compare .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.compare .col.pick{border:2px solid var(--accent)}
.compare a.col{display:block}
.compare .col h4{font:600 16px var(--sans);display:flex;justify-content:space-between;align-items:center;gap:8px}
.compare ul{list-style:none;padding:0}
.compare li{padding-left:22px;position:relative;font-size:14px}
.compare li.pro::before{content:"✓";position:absolute;left:0;color:var(--good-ink);font-weight:700}
.compare li.con::before{content:"✕";position:absolute;left:0;color:var(--bad-ink);font-weight:700}

/* fold (accordion) & tabs (radio, no JS) */
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);margin:10px 0}
details.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.fold>summary::after{content:"+";font:500 18px var(--mono);color:var(--muted)}
details.fold[open]>summary::after{content:"–"}
details.fold>div{padding:0 16px 14px}
.tabs{margin:14px 0}.tabs>input{position:absolute;opacity:0;pointer-events:none}
.tabs>label{display:inline-block;padding:7px 14px;border-radius:999px;font:500 13px var(--sans);cursor:pointer;color:var(--ink-2);border:1px solid var(--line);margin:0 4px 8px 0;background:var(--surface)}
.tabs>.panel{display:none}
.tabs>input:checked+label{background:var(--ink);color:var(--page);border-color:var(--ink)}
.tabs>input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}

/* figure & quote */
figure.fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px;overflow:hidden}figure.fig img{width:100%;height:auto;border-radius:10px;display:block}
figure.fig figcaption{font-size:13px;color:var(--ink-2);padding:10px 8px 4px}
blockquote.pull{font:500 22px/1.4 var(--display);letter-spacing:-.01em;border-left:4px solid var(--accent);padding:18px 22px;background:var(--accent-wash);border-radius:0 var(--r) var(--r) 0}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow)}dl.kv dt{color:var(--muted)}dl.kv dd{font-weight:500}

/* week grid / heat */
.week{display:grid;grid-template-columns:90px repeat(var(--cols,7),1fr);gap:4px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.week .h{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;text-align:center;padding:4px 0}
.week .rl{color:var(--ink-2);align-self:center}
.week .c{border-radius:8px;padding:8px 6px;min-height:44px;background:var(--surface-2);text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.25}
.week .c.k1{background:color-mix(in srgb,var(--s1) 18%,var(--surface))}.week .c.k2{background:color-mix(in srgb,var(--s2) 18%,var(--surface))}
.week .c.k3{background:color-mix(in srgb,var(--s3) 20%,var(--surface))}.week .c.k4{background:color-mix(in srgb,var(--s4) 22%,var(--surface))}
.week .c.k5{background:color-mix(in srgb,var(--s7) 16%,var(--surface))}

/* buttons & inputs */
.btn{font:500 13px var(--sans);padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink)}.btn.primary{background:var(--ink);color:var(--page);border-color:var(--ink)}
input.in,textarea.in{font:14px var(--sans);padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);color:var(--ink)}
textarea.in{width:100%;min-height:90px}

.footer{margin-top:72px;padding:16px 20px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);font:12px/1.6 var(--mono);color:var(--ink-2)}


/* ---------- flow rhythm: one rule spaces every block (no touching, no double gaps) ---------- */
.sec>*+*,.split>div>*+*,.flow>*+*,details.fold>div>*+*,.tabs>.panel>*+*,.card>*+*{margin-top:var(--flow,20px)}
.sec>.sec-head+*{margin-top:0}
:where(.sec,.flow,.tabs>.panel)>:is(p,ul,ol),.split>div>:is(p,ul,ol),.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;box-shadow:var(--shadow);max-width:none}
:where(.sec,.flow,.tabs>.panel,.split>div)>:is(ul,ol){padding-left:38px}
.note>*+*{margin-top:10px}.note>:first-child{margin-top:0}.note>:last-child{margin-bottom:0}.note p{max-width:var(--measure)}
:where(.stats,.chart,.tablewrap,.callout,.compare,.timeline,.grid,.points,.minis,.masonry,.week,.rings,figure.fig,.meter,details.fold,.tabs,.steps,blockquote.pull){margin-top:0;margin-bottom:0}
.split{gap:20px 28px}
/* compact "points": icon + bold lead + one line — replaces boxes that hold one sentence */
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.point{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
/* clickable bullets: the WHOLE item is the link, with hover + an arrow so it reads as clickable */
a.point,a.col{color:inherit;text-decoration:none;transition:border-color .2s,box-shadow .2s,transform .2s;cursor:pointer}
a.point:hover,a.col:hover{border-color:var(--accent);box-shadow:var(--shadow-lift);transform:translateY(-1px)}
a.point b::after,a.col h4 .go::after{content:" →";color:var(--accent-ink)}
a.point:hover b{color:var(--accent-ink)}
/* a list item that points somewhere: the whole row is the link */
a.row{display:block;color:inherit;text-decoration:none;border-radius:8px;margin:0 -8px;padding:3px 8px;cursor:pointer}
a.row:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}a.row::after{content:" →";color:var(--accent-ink);font-weight:600}
.point .pi{width:38px;height:38px;border-radius:11px;background:var(--c,var(--accent-wash));display:grid;place-items:center;font-size:18px}
.point b{display:block;font-size:15px}
.point p{margin:2px 0 0;font-size:14px;line-height:1.5;color:var(--ink-2)}
/* mini tiles: horizontal, dense, still picture-led */
.minis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(var(--min,250px),1fr))}
.mini{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 14px 10px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);color:inherit;text-decoration:none}
a.mini:hover{border-color:var(--line-2);box-shadow:var(--shadow-lift)}
.mini img,.mini .ph{width:64px;height:64px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:3px}
.mini .ph{display:grid;place-items:center;font-size:24px}
.mini .t{font-weight:600;font-size:14px;line-height:1.3}
.mini .m{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.mini .a{font:600 15px var(--sans);text-align:right;white-space:nowrap}
/* masonry: variable-height cards without stretched empty space */
.masonry{columns:var(--cols,3) var(--min,290px);column-gap:16px}
.masonry>*{break-inside:avoid;margin:0 0 16px!important;width:100%}
.grid{align-items:start}.compare{align-items:start}
/* interactive charts (ECharts, rendered by window.__viz) */
.viz{width:100%;min-height:120px;overflow:hidden}
.viz .viz-fb{font-size:12px;width:100%;table-layout:fixed}.viz .viz-fb td,.viz .viz-fb th{padding:4px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viz-tip{font:13px var(--sans)!important;z-index:70!important;max-width:min(320px,calc(100vw - 24px));white-space:normal!important}


/* ---------- floating section rail (auto-built from section.sec; dim while reading, expands on hover) ---------- */
.rail{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:45;display:flex;flex-direction:column;gap:1px;padding:10px 8px;border-radius:14px;border:1px solid transparent;opacity:.6;transition:opacity .35s,background .2s,box-shadow .2s,border-color .2s;max-height:80vh;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail a{display:flex;align-items:center;justify-content:flex-end;gap:10px;text-decoration:none;color:var(--ink-2);font:500 12.5px/1.2 var(--sans);padding:4px 5px;border-radius:8px;white-space:nowrap}
.rail a .lb{max-width:0;overflow:hidden;opacity:0;transition:max-width .25s var(--ease),opacity .2s}
.rail a .lb b{font:500 10.5px var(--mono);color:var(--muted);margin-right:6px}
.rail a .tk{flex:none;width:14px;height:3px;border-radius:2px;background:var(--line-2);transition:width .2s,background .2s}
.rail a.sub{font-size:12px;color:var(--muted)}.rail a.sub .tk{width:7px;height:2px}
.rail a.on{color:var(--ink)}.rail a.on .tk{width:24px;background:var(--accent)}.rail a.sub.on .tk{width:12px}
.rail:hover,.rail:focus-within{opacity:1;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow-lift);border-color:var(--line)}
.rail:hover a .lb,.rail:focus-within a .lb{max-width:240px;opacity:1}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
html.scrolling .rail:not(:hover){opacity:.22}
@media (max-width:1180px){.rail{display:none}.toc{padding-right:184px} /* band stays full width; pills scroll inside, clear of the fixed toolbar */}
@media (min-width:1181px){.toc{position:static;background:transparent;backdrop-filter:none}}
@media print{.rail{display:none!important}}

/* ---------- responsive ---------- */
@media (max-width:900px){.split{grid-template-columns:1fr}}
@media (max-width:760px){
  .sec>*+*,.split>div>*+*,.flow>*+*{--flow:16px}.mini{grid-template-columns:52px 1fr auto}.mini img,.mini .ph{width:52px;height:52px}
  body{font-size:15px}.wrap{padding-bottom:64px}
  .hero{padding-top:72px;padding-bottom:28px}.toc{padding:8px 184px 8px var(--gut)}
  .split{grid-template-columns:1fr}
  .mrow{grid-template-columns:72px 1fr;gap:12px}.mrow .th{width:72px;height:72px}.mrow .aside{grid-column:2;text-align:left}
  .stat .v{font-size:26px}.stats{grid-template-columns:1fr 1fr}.stat{padding:14px}
  .sec{margin-top:48px}
  .bars{display:block}.bars .row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-bottom:12px}.bars .tr{grid-column:1/-1;grid-row:2}
  .week{grid-template-columns:64px repeat(var(--cols,7),minmax(64px,1fr));overflow-x:auto}
}
/* ---------- print / PDF ---------- */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:12px}
  .toolbar,.skip,.toc,.no-print{display:none!important}
  *{animation:none!important;transition:none!important}
  .card,.stat,.icard,.mrow,.chart,.tablewrap,.compare .col{box-shadow:none}
  .icard,.mrow,.stat,.chart,tr,.tl,.compare .col{break-inside:avoid}
  .tablewrap{overflow:visible}.hero{padding-top:12px}
  .sec{margin-top:26px}
  details.fold{border:none}details.fold>div{display:block!important}
  .tabs>.panel{display:block!important}.tabs>label{display:none}
}
</style>
